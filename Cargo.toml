[workspace]
members = [
    "crates/tiler-artifact",
    "crates/tiler-cache",
    "crates/tiler-compiler",
    "crates/tiler-ir",
    "crates/tiler-metal",
    "crates/tiler-metal-aot",
    "crates/tiler-reference",
    "crates/tiler-runtime",
    "prototypes/serial-sum-compile",
    "prototypes/serial-sum-run",
]
exclude = [
    "spikes/extensions/operation-api",
    "spikes/extensions/proc-macro-visibility",
    "spikes/indexing/index-access-model",
    "spikes/macro-environment/fixture",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moderately-ai/tiler"
publish = false

[workspace.dependencies]
metal = "0.33.0"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
# The governed artifact digest. Hand-rolling SHA-256 was a mistake: the version
# it replaced ran at 53 MiB/s because a `[u32; 8]` rotate silently became a
# generic slice rotation, and this crate cannot reach the ARMv8 crypto
# instructions `sha2` selects at runtime, because workspace policy forbids
# unsafe code. Bytes are identical by specification and pinned by test.
sha2 = "0.11.0"
tiler-artifact = { path = "crates/tiler-artifact" }
tiler-cache = { path = "crates/tiler-cache" }
tiler-compiler = { path = "crates/tiler-compiler" }
tiler-ir = { path = "crates/tiler-ir" }
tiler-metal = { path = "crates/tiler-metal" }
tiler-metal-aot = { path = "crates/tiler-metal-aot" }
tiler-reference = { path = "crates/tiler-reference" }
tiler-runtime = { path = "crates/tiler-runtime" }
trybuild = "1.0.114"

# Keep useful file/line backtraces without paying for full variable debug data.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Compile dependencies enough to keep tests and tools responsive as the
# workspace grows. Override a specific package when debugging requires it.
[profile.dev.package."*"]
opt-level = 1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A length limit is a proxy for complexity and a bad one here: the functions it
# flags are exhaustive `match`es over deliberately wide enums, where the only way
# to get under the limit is a wildcard arm -- which is exactly what stops a newly
# added variant from being a build error. Trading that for a line count is a net
# loss, so the lint is off rather than allowed site by site.
too_many_lines = "allow"
