[workspace]
members = [
    "crates/tiler",
    "crates/tiler-artifact",
    "crates/tiler-build",
    "crates/tiler-cache",
    "crates/tiler-compiler",
    "crates/tiler-conformance",
    "crates/tiler-digest",
    "crates/tiler-ir",
    "crates/tiler-macros",
    "crates/tiler-metal",
    "crates/tiler-metal-aot",
    "crates/tiler-reference",
    "crates/tiler-runtime",
    "prototypes/candle-metal-adapter",
    "prototypes/serial-sum-compile",
    "prototypes/serial-sum-run",
]
exclude = [
    "spikes/extensions/operation-api",
    "spikes/extensions/proc-macro-visibility",
    "spikes/indexing/index-access-model",
    "spikes/macro-environment/fixture",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moderately-ai/tiler"
publish = false

[workspace.dependencies]
metal = "0.33.0"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
# The implementation behind the governed digest, reached by `tiler-digest` and
# by nothing else. Hand-rolling SHA-256 was a mistake: the version it replaced
# ran at 53 MiB/s because a `[u32; 8]` rotate silently became a generic slice
# rotation, and `tiler-digest` cannot reach the ARMv8 crypto instructions `sha2`
# selects at runtime, because it inherits the `forbid` below. That is a claim
# about the crate that would hand-roll the digest, not about the workspace as a
# whole: the note under `[workspace.lints.rust]` names two members carrying
# `deny` instead, and neither is this one. Bytes are identical by specification
# and pinned by test.
sha2 = "0.11.0"
serde_json = "1.0.151"
# `tiler` sorts here and is deliberately absent. It is the consumer-facing
# facade, so nothing in this workspace may depend on it, and an entry here would
# only make that edge easy to add by accident.
# `crates/tiler/tests/dependency_direction.rs` is what actually enforces it.
tiler-artifact = { path = "crates/tiler-artifact" }
tiler-build = { path = "crates/tiler-build" }
tiler-cache = { path = "crates/tiler-cache" }
tiler-compiler = { path = "crates/tiler-compiler" }
# `tiler-conformance` sorts here and is deliberately absent for the same reason
# `tiler` is: it is the top of the graph on the evidence side, it exists to
# observe the other members rather than to be composed with them, and an entry
# here would only make an edge to it easy to add by accident.
tiler-digest = { path = "crates/tiler-digest" }
tiler-ir = { path = "crates/tiler-ir" }
tiler-macros = { path = "crates/tiler-macros" }
tiler-metal = { path = "crates/tiler-metal" }
tiler-metal-aot = { path = "crates/tiler-metal-aot" }
tiler-reference = { path = "crates/tiler-reference" }
tiler-runtime = { path = "crates/tiler-runtime" }
trybuild = "1.0.114"
# The workspace unsafe-site test's Rust lexer must use Rust's Unicode XID
# identifier grammar; `char`'s alphabetic/alphanumeric categories are narrower.
unicode-ident = "1.0.24"

# Keep useful file/line backtraces without paying for full variable debug data.
#
# `opt-level = 1` applies to the workspace members. The glob below reaches only
# dependencies -- Cargo's `"*"` does not match members -- so until this line
# existed every `tiler-*` crate compiled unoptimized. Measured on an M4 Max,
# interleaved, min of 4 forced full-member rebuilds:
#
#   rebuild every member      5.52 s at 0  ->  5.22 s at 1
#   rebuild one changed file  2.46 s at 0  ->  2.27 s at 1
#   `cargo nextest` suite     4.11 s at 0  ->  4.06 s at 1
#   dev-profile decode        40.9 us at 0 -> 18.3 us at 1
#
# So it is not a trade: level 1 is LLVM's cheapest real tier and it removes more
# downstream work than it adds, leaving build time flat while dev-profile code
# runs about 2.2x faster. The suite does not move because at ~4 s for 1,013
# tests it is bound by process and harness overhead rather than by the code
# under test -- the compute that used to dominate it is gone.
#
# Raising it for named digest-heavy crates only was considered and eliminated by
# the same numbers: that option exists to dodge a build cost, and there is none
# to dodge, so it buys nothing and costs a hand-maintained package list.
#
# `debug_assertions`, `overflow_checks`, and `line-tables-only` are unchanged at
# level 1 (confirmed via `cargo build -Z unstable-options --unit-graph`), and
# Rust never enables fast-math, so no numerical result moves.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
opt-level = 1

# Compile dependencies enough to keep tests and tools responsive as the
# workspace grows. Override a specific package when debugging requires it.
[profile.dev.package."*"]
opt-level = 1

# Reaches a member only through `[lints] workspace = true` in that member's
# manifest, and **two members deliberately do not carry it**:
# `crates/tiler-conformance` and `prototypes/serial-sum-run`. Each restates this
# table with `unsafe_code = "deny"` instead of `forbid`, because `forbid` cannot
# be reopened by an inner attribute at any scope and both need narrow, reasoned
# `#[allow(unsafe_code)]` on the functions that must reach `MTLBuffer` storage
# through the `metal` binding's raw pointer. Each member's own `[lints]` note
# records the decision that admitted it -- Tom's of 2026-07-25 for the prototype
# and of 2026-08-07 for the conformance crate -- and ADR 0079,
# `docs/decisions/0079-permit-unsafe-code-case-by-case-at-named-sites.md`,
# governs both. The exception is stated here as well as there so a reader of
# this table can reach it; a difference named at one end only reads as an
# oversight from the other.
#
# Four checks hold the arrangement, and none of them restates this table:
#
# - `crates/tiler/tests/workspace_lint_inheritance.rs` reads the member list
#   above and fails on any member that is not one of those two and does not
#   inherit -- so a *third* member dropping these two lines is a red test rather
#   than a crate that quietly stops being linted. It also fails when a declared
#   exception has no check over its own table.
# - `crates/tiler-conformance/src/lints.rs` reads this file and its member's and
#   fails unless they differ by exactly `rust.unsafe_code`. Adding, tightening,
#   or removing a lint here reaches the fourteen inheriting members for free and
#   reaches neither of these two, so that comparison is what makes the drift
#   visible.
# - `prototypes/serial-sum-run/tests/lint_table.rs` is one `#[path]` line
#   running that same module from the prototype's root. One reader, two roots --
#   a second parser of these tables would drift against the first exactly as the
#   tables drift without either.
#
# The per-site half is held separately by
# `crates/tiler/tests/workspace_unsafe_sites.rs`. It cross-checks the explicit
# member roots above against Cargo's actual metadata package set, enumerates all
# metadata target roots, walks the member source trees, and follows literal
# local source-loading attributes/macros before pinning the four admitted
# permissions by workspace-relative path, complete item signature, and exact
# reason. Its lexer discards comments and strings, recognizes wrapped direct
# attributes, and fails closed on unsupported permission or source-loading
# syntax. Across all sixteen member trees it separately closes workspace-owned
# and source-generating macro authority: fifteen private local `macro_rules!`
# definitions with duplicate multiplicity refused, the guarded `tensor!`
# procedural exporter and its sole facade
# re-export, the exact facade-owned compiler `compile_error!` re-export used by
# both producer streams, exact source-path/multiplicity identities for 73 fixture
# invocations plus one rustdoc invocation, and the exact
# compiler/std macro, attribute, and derive vocabularies currently used.
# Custom/path-qualified invocations, workspace-owned local declarative macro
# exports or re-exports, extra procedural exporters, aliases of the exact
# `tiler`, `tiler_macros`, `std`, and `core` macro namespaces, dynamic
# macro/attribute names, and unclassified derives or
# attributes fail closed. A direct proc-macro dependency from either `deny`
# package is an early diagnostic, not the closure argument: transitive and
# re-exported macros need not be direct edges. Cargo metadata separately pins
# the facade's `tiler_macros` dependency spelling to the workspace producer and
# refuses facade Cargo bindings named `core` or `std`, because either would
# retarget the compiler-builtin diagnostic re-export at its definition site.
# A second test invokes rustc with
# `--force-warn=unsafe-code` through Cargo JSON over every target in those two
# packages and pins the six visible diagnostics by package, target, target
# root, operation source, and multiplicity. It catches active includes and
# source reuse that a lexical file inventory cannot identify.
#
# Every metadata target Cargo marks `doctest = true` carries
# `#![doc(test(attr(forbid(unsafe_code))))]`, because rustdoc compiles extracted
# examples as separate crates that do not inherit this table. The inventory
# also classifies macros, attributes, derives, hidden lines, literal generated
# docs, and unsupported source loads in extracted Rust. Identifier tokens use
# Rust's Unicode XID grammar, while opaque raw-string forwarding and
# stringification composed into executable rustdoc fail closed. The compiler
# and the three lint-table checks above remain the lint-level authority; dependency
# internals and compiler-builtin generated implementation details are outside
# ADR 0079's workspace-authored source-authority inventory.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A length limit is a proxy for complexity and a bad one here: the functions it
# flags are exhaustive `match`es over deliberately wide enums, where the only way
# to get under the limit is a wildcard arm -- which is exactly what stops a newly
# added variant from being a build error. Trading that for a line count is a net
# loss, so the lint is off rather than allowed site by site.
too_many_lines = "allow"
