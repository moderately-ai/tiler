schema_version = 1
tickets_dir = "tickets"
default_base = "main"

[guard]
# A declared-area overlap with an open sibling is a non-failing WARN by default
# (exit 0); an under-declaration (scope escape) always fails (exit 6). Set true
# (or pass `guard --strict`) to make an overlap gate too.
# gate_collisions = false

[language]
# "none" = path-glob scopes only; "rust" = also expand via the cargo crate graph.
backend = "rust"

[workflow.states.todo]
category = "dispatchable"

[workflow.states.ready]
category = "dispatchable"

[workflow.states.in-progress]
category = "open"

[workflow.states.review]
category = "open"

[workflow.states.blocked]
category = "parked"

# A ticket whose deliverables are conditional on an ADR being accepted must
# depend on that ADR's `accept-adr-NNNN-*` ticket, never on the ticket that
# drafted the record. Drafting a *proposed* ADR is a completed outcome, so the
# drafting ticket is correctly `done` the moment the file exists, and a
# dependency on it cannot distinguish "written" from "decided" — the dependent
# surfaces in `ready` and reaches a worker who can only park it by hand. An
# acceptance ticket sits permanently in the parked state below, which `ready`
# excludes and which never satisfies a dependent, so the block is structural and
# `rollup` names the undecided record as its cause. Only Tom closes one.
[workflow.states.awaiting-decision]
category = "parked"

[workflow.states.deferred]
category = "parked"

[workflow.states.done]
category = "terminal"
satisfies_dependents = true

[workflow.states.closed]
category = "terminal"
satisfies_dependents = false

