# Optionally map a scope to its owning crate so the Rust backend can expand
# reverse-dependents (requires `cargo` at runtime).
[scope_crates]
"implementation/digest" = "tiler-digest"
"implementation/ir" = "tiler-ir"
"implementation/reference" = "tiler-reference"
"implementation/artifact" = "tiler-artifact"
"implementation/cache" = "tiler-cache"
"implementation/compiler" = "tiler-compiler"
"implementation/metal" = "tiler-metal"
"implementation/metal-aot" = "tiler-metal-aot"
"implementation/runtime" = "tiler-runtime"
"implementation/build" = "tiler-build"
"implementation/frontend" = "tiler-macros"
"implementation/conformance" = "tiler-conformance"

# The CPU and Candle scopes have no crate mapping until their owning crates are
# admitted. `implementation/cpu` reserves the scheduling area selected by the
# accepted 2026-08-12 direction; its admission ticket must atomically add the
# real package and its mapping rather than leaving a temporary prototype entry.
# `implementation/candle` stays unmapped now that a prototype occupies its
# globs: `prototypes/candle-metal-adapter` (`tiler-prototype-candle`) is
# deliberately not a component other crates may depend on. The Metal-AOT,
# runtime, cache, and build mappings name their real owners. Each crate-admission
# ticket must atomically add the real workspace package and add or move its
# mapping here.
#
# The frontend scope owns two crates, `tiler` and `tiler-macros`, and both are
# covered by its globs above. It maps to `tiler-macros` because that is the one
# with reverse dependents to expand: `tiler` re-exports from it, while nothing
# may depend on `tiler` itself -- the `dependency_direction` test in that crate
# is what holds the frontend at the top of the graph.
#
# The runtime scope's globs still cover `prototypes/serial-sum-run/**` as well,
# because the proof executable and the loader it drives are edited together;
# only the reverse-dependency expansion moved off the prototype.
#
# The conformance scope maps to `tiler-conformance`, admitted 2026-08-07 under
# `admit-the-conformance-crate-to-the-workspace` on Tom's decision that anything
# long-term holding lives in a real crate rather than in `prototypes/`. Its
# reverse-dependent set is empty and stays empty by design -- nothing depends on
# a crate whose job is to execute the others and compare the result against the
# oracle -- so the expansion this mapping enables adds nothing today. It is
# still the real owner rather than a temporary entry, which is the difference
# from the Candle case above: this mapping is never moved, and without it a
# reader would have to establish the crate's absence from this table is
# deliberate rather than the omission the comment above forbids.

# Name a forked/external dependency (pinned via `git = … rev = …`) as a scope.
# The guard flags a branch that bumps the pin (matched by `repo`) or edits an
# in-tree fork `paths` glob, against tickets declaring the same scope.
[external_scopes]
# "sqlparser-fork" = { repo = "tomsanbear/sqlparser", paths = [] }

# Tune how costly an exclusive overlap on a scope is for tracks/next
# (--max-overlap): weight 0 = free to co-edit (an additive hub), higher =
# riskier. Default 1; a shared-by-both claim is always free.
[scope_policy]
# "core" = { weight = 0 }
