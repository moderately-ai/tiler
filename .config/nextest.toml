# Nextest's run configuration.
#
# `make test` runs the suite through nextest and doc-tests through
# `cargo test --doc`, because **nextest does not run doc-tests at all**. That
# split is the reason both commands appear in the Makefile: dropping the second
# would silently stop running the compile-fail doc-tests on `Preflight::commit`,
# which are the compiler-checked evidence for ADR 0051's one-way commit.

[profile.default]
# A green run prints its summary line and nothing else. The suite is ~960 tests
# and a wall of PASS lines buries the only line that matters when it is not
# green. `leak` keeps failures and names a leaky test; `final-status-level` keeps
# failures in the summary too — `leak` is not one of its levels, and the summary
# already carries the leaky *count*, so only the live line needed changing.
#
# `leak` sits between `slow` and `pass`, so it adds a line only when a test is
# slow or leaky and never on a clean run; `slow-timeout` below is 60s, so in
# practice it costs nothing until something happens. It is set because a leaky
# verdict is otherwise a count with no name, which is unactionable: three of them
# were recorded before the cause was known, and each cost a fresh investigation.
#
# What a leaky verdict here means, so the next reader does not repeat that hunt:
# nextest captures each test's stdout/stderr through a pipe and calls the test
# leaky when the pipe has not reached EOF 100ms after the process exits. On
# macOS the standard library builds pipes with `pipe()` followed by a separate
# `set_cloexec()` — there is no `pipe2` — so between those two syscalls the
# descriptors are inheritable, and a `posix_spawn` on another nextest worker
# thread hands one test's pipe to an unrelated sibling. The sibling holds the
# write end until it exits, and the arbitrary test whose pipe was captured is
# reported leaky. Measured on this workspace: 139 of 54020 test processes across
# 20 full-workspace runs started with a stray inherited pipe descriptor, and 2 of
# those 20 runs turned into a leaky verdict, naming a different test each time.
# Nothing in this repository owns that descriptor and no test is at fault.
#
# So read the *name* across runs, not the count: a leaky verdict that wanders
# between unrelated tests is that platform race and is benign — the test already
# passed and the captured output is complete. A leaky verdict that names the same
# test repeatedly is a real unreaped child, and that is a defect to fix in the
# test rather than to report here.
status-level = "leak"
final-status-level = "fail"

# Output once, where it happened. `immediate-final` was measured and rejected:
# it reprints every failure's stdout and stderr verbatim under the summary, so a
# run with several failures says everything twice. `final-status-level` already
# re-lists the failing test *names* at the end, which is the part worth
# repeating; the detail is not.
failure-output = "immediate"
success-output = "never"

# Run the whole suite rather than stopping at the first failure. Tests here take
# milliseconds, so finishing costs seconds and buys the complete failure list.
# Stopping early hides the siblings of a failure, and a broken invariant in this
# workspace usually breaks several tests at once — the shape of the failure set
# is most of the diagnosis.
fail-fast = false

# Report a slow test; never kill one. Most tests here take milliseconds, but
# `single_byte_corruptions_are_rejected` takes ~13s warm and was measured above
# 30s on a machine also running a build — so any `terminate-after` low enough to
# catch a hang is also low enough to kill that test under load, and a spurious
# kill is worse than a slow gate. `audit-the-suite-s-slowest-tests` is where the
# 13s itself is being investigated.
slow-timeout = { period = "60s" }

# `--profile timing` reports every test slower than a second instead of only
# failures. The default profile is deliberately quiet, which also hides the one
# test that is the suite's whole critical path; this is how to see it again.
# Cited by `audit-the-suite-s-slowest-tests` as its reproduction command.
[profile.timing]
inherits = "default"
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "1s" }
