[package]
name = "tiler-prototype-run"
description = "Non-published runner for Tiler's serial-Sum value proof"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tiler-prototype-run"
path = "src/main.rs"
test = true
doc = true

[dependencies]
tiler-artifact.workspace = true
# The runner offers the *producer's* authoritative Metal declaration rather than
# one it reconstructs. `construct-and-bind-the-first-authoritative-metal-compile-profile`
# forbids deriving the offered profile from a `Compilation` or from the artifact
# under validation, and `tiler-build` is the one owner of that declaration, so
# this edge is what removes the last derived host statement.
tiler-build.workspace = true
tiler-compiler.workspace = true
tiler-ir.workspace = true
tiler-metal.workspace = true
tiler-metal-aot.workspace = true
tiler-reference.workspace = true
tiler-runtime.workspace = true

# `metal` binds Apple frameworks and cannot link anywhere else, so declaring it
# unconditionally made `cargo check --workspace` structurally impossible on a
# non-Apple host. The proof body is selected by the same `cfg` in `src/main.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true

# This crate does not inherit `[workspace.lints]`, and the difference is exactly
# one lint. The workspace sets `unsafe_code = "forbid"`, which cannot be relaxed
# by an inner attribute at any scope; this crate sets `deny` instead so the two
# functions that must reach Objective-C buffer storage can each carry a narrow,
# reasoned `#[allow(unsafe_code)]`. Every other member keeps `forbid`.
#
# `deny` rather than `allow`: unsafe stays a hard error everywhere in this crate
# except at the two sites that opt in by name.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirrors the workspace, which this crate cannot inherit; see the note there.
too_many_lines = "allow"
