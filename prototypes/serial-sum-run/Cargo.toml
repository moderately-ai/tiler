[package]
name = "tiler-prototype-run"
description = "Non-published runner for Tiler's serial-Sum value proof"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tiler-prototype-run"
path = "src/main.rs"
test = true
doc = true

[dependencies]
metal.workspace = true
tiler-artifact.workspace = true
tiler-compiler.workspace = true
tiler-ir.workspace = true
tiler-metal.workspace = true
tiler-metal-aot.workspace = true
tiler-reference.workspace = true

# This crate does not inherit `[workspace.lints]`, and the difference is exactly
# one lint. The workspace sets `unsafe_code = "forbid"`, which cannot be relaxed
# by an inner attribute at any scope; this crate sets `deny` instead so the
# single function that must call an Objective-C buffer API can carry a narrow,
# reasoned `#[allow(unsafe_code)]`. Every other member keeps `forbid`.
#
# `deny` rather than `allow`: unsafe stays a hard error everywhere in this crate
# except at the one site that opts in by name.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
