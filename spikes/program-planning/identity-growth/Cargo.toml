[package]
name = "identity-growth"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root, following `spikes/program-planning/reduction-crossover`:
# `make` never reaches here, and the spike's dependency set is its own. The path
# dependencies below still resolve their `[lints]` through the repository
# workspace they belong to, and this directory carries no `rust-toolchain.toml`
# so the repository pin resolves by ancestry.
[workspace]

[dependencies]
tiler-build = { path = "../../../crates/tiler-build" }
tiler-compiler = { path = "../../../crates/tiler-compiler" }
tiler-ir = { path = "../../../crates/tiler-ir" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
