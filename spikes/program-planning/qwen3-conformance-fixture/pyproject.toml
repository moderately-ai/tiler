# Environment for the Qwen3-0.6B-Base C1 conformance reference fixture.
#
# This spike pins where every other Python harness in this repository does not.
# `spikes/README.md` records that a harness normally runs under `uv run --with
# <package>` because its dependencies are standard library plus pytest, and a
# floating resolution costs nothing when the harness only checks its own
# arithmetic. Here the dependency *is* the evidence: the retained record is a
# bit-exact digest of what one exact `transformers` revision computes, so an
# unpinned resolution would silently re-baseline the fixture. `transformers` is
# fixed at 4.51.0 because the checkpoint's own `config.json` declares that
# version, which makes it the definitional reference rather than one candidate;
# `torch` is fixed because reduction order in its CPU kernels is what the
# digests are a fingerprint of.
[project]
name = "qwen3-conformance-fixture"
version = "0.1.0"
description = "F32 reference logit fixture for the C1 conformance row of the first Metal language-model workload"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.6.0",
    "transformers==4.51.0",
    "tokenizers==0.21.1",
    "safetensors==0.5.3",
    "numpy==2.2.5",
    # Not optional here despite being an optional extra of `transformers`:
    # 4.51.0's `from_pretrained` defaults to the meta-device init path for a
    # safetensors checkpoint and calls `init_empty_weights`, which lives in
    # `accelerate`. Without it the load raises `NameError` before any tensor is
    # read. The alternative -- `low_cpu_mem_usage=False` -- would materialize a
    # randomly initialized model first and is a worse default for a fixture,
    # because a weight that failed to load would be random rather than absent.
    "accelerate==1.6.0",
]

# Tiler develops on macOS only, so the lock resolves for exactly that platform
# rather than carrying resolutions (CUDA wheel variants above all) for hosts
# this repository does not support.
[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
