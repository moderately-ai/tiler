[package]
name = "qwen3-checkpoint-f32-inputs"
version = "0.0.0"
edition = "2024"
publish = false

# This is intentionally a separate workspace. The root workspace forbids its
# members from depending on the `tiler` facade; this conformance consumer must
# implement the facade's TensorAdapter boundary.
[workspace]

[dependencies]
safetensors = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tiler = { path = "../../../crates/tiler" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
