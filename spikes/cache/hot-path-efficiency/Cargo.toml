[workspace]
members = ["harness"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
tiler-artifact = { path = "../../../crates/tiler-artifact" }
tiler-cache = { path = "../../../crates/tiler-cache" }
tiler-compiler = { path = "../../../crates/tiler-compiler" }
tiler-ir = { path = "../../../crates/tiler-ir" }

# The spike mirrors the repository dev profile rather than inheriting it: this is
# a separate workspace, so the root profile does not reach it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# Every number this harness reports is taken from a release build, because a
# debug build measures the optimizer's absence rather than the cache. The
# profile is stated here so the recorded invocation is reproducible without a
# second file to consult.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
