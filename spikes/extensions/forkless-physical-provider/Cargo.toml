[workspace]
members = ["acme-provider", "probe"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
acme-provider = { path = "acme-provider" }
tiler-compiler = { path = "../../../crates/tiler-compiler" }
tiler-ir = { path = "../../../crates/tiler-ir" }
tiler-metal = { path = "../../../crates/tiler-metal" }
trybuild = "1.0.114"

# The spike mirrors the repository dev profile rather than inheriting it: this is
# a separate workspace, so the root profile does not reach it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
