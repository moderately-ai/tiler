[package]
name = "scalar-cpu-vertical"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root. A nested spike is deliberately not a member of the
# repository workspace: `make` never reaches here, and the spike's dependency
# set is its own. The path dependencies below still resolve their `[lints]`
# through the repository workspace they belong to.
[workspace]

[dependencies]
tiler-artifact = { path = "../../../crates/tiler-artifact" }
tiler-compiler = { path = "../../../crates/tiler-compiler" }
tiler-ir = { path = "../../../crates/tiler-ir" }
tiler-reference = { path = "../../../crates/tiler-reference" }
tiler-runtime = { path = "../../../crates/tiler-runtime" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
