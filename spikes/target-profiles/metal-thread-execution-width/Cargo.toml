[package]
name = "metal-thread-execution-width"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root, following `spikes/target-profiles/metal-grid-axis-extent`:
# `make` never reaches here and this spike's dependency set is its own.
[workspace]

[dependencies]
metal = "0.33.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
