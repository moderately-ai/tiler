[package]
name = "backend-provider-portfolio"
version = "0.0.0"
edition = "2024"
publish = false
description = "End-to-end proof that standard Metal, a forkless custom Metal physical provider, and a bounded CPU backend compose through the accepted per-responsibility seams"

# Its own workspace root. A nested spike is deliberately not a member of the
# repository workspace: `make` never reaches here, and the spike's dependency
# set is its own. The path dependencies below still resolve their `[lints]`
# through the repository workspace they belong to.
[workspace]

[dependencies]
tiler-artifact = { path = "../../../crates/tiler-artifact" }
tiler-build = { path = "../../../crates/tiler-build" }
tiler-cache = { path = "../../../crates/tiler-cache" }
tiler-compiler = { path = "../../../crates/tiler-compiler" }
tiler-ir = { path = "../../../crates/tiler-ir" }
tiler-metal = { path = "../../../crates/tiler-metal" }
tiler-metal-aot = { path = "../../../crates/tiler-metal-aot" }
tiler-reference = { path = "../../../crates/tiler-reference" }
tiler-runtime = { path = "../../../crates/tiler-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

# Mirrors the repository dev profile rather than inheriting it: this is a
# separate workspace, so the root profile does not reach it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# `deny` rather than the workspace `forbid`: the Metal adapter has exactly two
# sites that must reach Objective-C buffer storage, and each opts in by name
# under ADR 0079. Everything else here is a hard error.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
