[package]
name = "inline-dispatch-spike"
description = "Out-of-tree consumer that dispatches inline Tiler regions on this host's Metal device"
version = "0.0.0"
edition = "2024"
publish = false
# So that `cargo run --release` stays the one-entry spike's recorded invocation
# after a second binary joined it. That transcript is cited from several
# documents, and a bare `cargo run` becoming ambiguous would invalidate the
# command those citations tell a reader to type.
default-run = "inline-dispatch-spike"

[[bin]]
name = "inline-dispatch-spike"
path = "src/main.rs"

# The two-entry consumer, sharing this crate's adapter rather than copying it.
# The adapter is already generic over entry count — it iterates the route's
# entries in `prepare_entries`, `plan_dispatch`, and `dispatch`, pairs the shared
# allocations, and creates one Metal encoder per entry — so a second crate would
# have duplicated 1,300 lines whose *generality* is the thing under test here. A
# bin target is its own crate root, so `mod adapter;` resolves to `src/adapter.rs`
# from either file with no path attribute.
[[bin]]
name = "multi-entry-dispatch-spike"
path = "src/multi_entry.rs"

[dependencies]
# The one crate a Tiler consumer declares. By path rather than by version
# because nothing here is published, and the point of the spike is that this is
# the *only* Tiler edge: no `tiler-runtime`, no `tiler-artifact`, no backend
# crate. Everything the adapter names is reached through this facade.
tiler = { path = "../../../crates/tiler" }
# The backend the embedded payload realizes. `0.33.0` is the version the
# repository's own Metal consumers pin (`[workspace.dependencies]` in the root
# manifest, used by `prototypes/serial-sum-run`), so the binding this spike
# reports refusals from is the same one the recorded prototypes report from.
metal = "0.33.0"

# Its own workspace, deliberately, and this is the placement decision the ticket
# reserved. `crates/tiler/tests/dependency_direction.rs` forbids any workspace
# package from depending on the frontend, and the root manifest's
# `[workspace.lints.rust] unsafe_code = "forbid"` cannot be relaxed by an inner
# attribute at any scope — so the buffer readback below could not exist in a
# member crate. An out-of-tree consumer costs neither.
[workspace]

# Mirrors the repository dev profile rather than inheriting it: this is a
# separate workspace, so the root profile does not reach it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# `deny` rather than the workspace's `forbid`: this crate has exactly one site
# that must call an Objective-C buffer API, and it opts in by name with the four
# things ADR 0079 requires. Everything else here is a hard error.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
