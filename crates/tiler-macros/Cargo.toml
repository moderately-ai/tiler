[package]
name = "tiler-macros"
description = "Procedural macro implementation for Tiler's inline tensor regions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
proc-macro = true
test = true
doctest = true
doc = true

# A `proc-macro` crate and everything it depends on are built for the *host* and
# never enter a consumer's target build graph. That is what makes this the crate
# permitted to hold the edge to the offline Apple driver: the frontend needs the
# canonical `ArtifactFamilySelection` that ADR 0049 requires every inline AOT
# request to carry, and putting the same edge on the `tiler` facade would link a
# process-spawning toolchain driver into every consumer on every platform
# instead. `crates/tiler/tests/dependency_direction.rs` keeps the facade free of
# it. The edge is normal rather than development because the expansion itself
# states the policy, not only its tests.
#
# `tiler-ir` is a second host-built edge, paid for the same way. `binding`
# derives a real `ShapeEnv` — the promoted symbolic index profile — instead of
# restating symbol declarations, root bindings, and availability phases inside
# the frontend, and it names `StorageScalar` so a declared operand's stored
# scalar is stated in the workspace's one authority over that subject rather than
# in a frontend-local copy.
[dependencies]
tiler-ir.workspace = true
tiler-metal-aot.workspace = true

[lints]
workspace = true
