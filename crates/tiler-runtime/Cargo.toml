[package]
name = "tiler-runtime"
description = "Device-free artifact loading and validation for Tiler runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = true
doctest = true
doc = true

[dependencies]
tiler-artifact.workspace = true

# Test-only, and deliberately not normal dependencies. ADR 0081 item 2 fixes
# this crate's one normal direct dependency at `[tiler-artifact]`; it does not
# claim a complete resolved closure. `identity_join` separately walks the
# dev-inclusive transitive `Cargo.lock` closure: it requires the artifact plus
# the IR and reference controls below, and refuses the compiler, emitter, AOT
# driver, cache, and build-provider packages. The out-of-crate adapter fixture
# in `tests/adapter_route` has to assemble a real verified program to route,
# which means the shared IR that `tiler-artifact` already links transitively;
# it compares its result against the independent oracle rather than against a
# formula restated in the test. Neither reaches `tiler-compiler`: a loader that
# could rebuild a plan instead of validating the one it was handed is the
# boundary the crate split exists to enforce, and that stays true of its tests.
[dev-dependencies]
tiler-ir.workspace = true
tiler-reference.workspace = true

[lints]
workspace = true
