[package]
name = "tiler-conformance"
description = "Cross-layer executed conformance evidence for Tiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = true
doctest = true
doc = true

# Normal dependencies rather than development ones, which inverts what every
# other member here does and is decided rather than accidental. Nothing depends
# on this crate and nothing may -- it is the top of the graph on the evidence
# side, as `tiler` is on the consumer side -- so its closure reaches no consumer
# and costs none, and a normal edge states what the crate is for where a
# development edge would only record what its tests happen to reach.
#
# The set is the vertical a conformance run crosses: the shared IR a program is
# built in, the compiler that plans it, the backend that lowers it, the offline
# driver that compiles the result, the artifact layer that carries it, the
# build-time orchestration that packages it, the expansion cache it is accepted
# or published through, the loader that validates it, and the reference oracle it
# is compared against.
#
# `tiler-cache` is a direct edge rather than a transitive one because
# `src/publication.rs` names `ExpansionCache` to publish the envelopes the routed
# half then reads back. `accept_or_publish_metal_plan` is the only public path
# from a checked plan to a verified artifact, and it takes a cache; the
# alternative -- assembling through `assemble_plan_artifact` directly -- would
# require this crate to restate the Metal backend's own per-stage binding kinds,
# zero-work dispatch policy, and launch preconditions, which is a backend fact
# and not a conformance one. Crossing the real acceptance path is also what the
# routed half is evidence about.
#
# `tiler-digest` is a direct edge rather than a transitive one because
# `src/envelope.rs` names `DigestAlgorithm::digest_external_record` to reproduce
# the L3 realization probe's retained raw `CC_SHA256` records, and the path that
# calls it runs from the device-reaching half rather than from tests alone -- so
# it is a normal edge on the same rule as every other row here. ADR 0111 admitted
# the typed raw-external result and deleted the SHA-256 implementation this crate
# used to carry, on the rule that a source file naming a crate's public item owns
# a direct Cargo edge. That deliberately corrects ADR 0106's statement that
# `tiler-digest` is reached only transitively and deliberately not named: the
# statement described the source as it then stood, and both that record and
# `docs/architecture.md` now carry dated corrections saying so.
#
# `tiler` and `tiler-macros` are absent and must stay absent. The crate header
# states why, and `crates/tiler/tests/dependency_direction.rs` is what enforces
# it -- against `Cargo.lock`, which merges normal and development edges into one
# list, so moving one of these to `[dev-dependencies]` would not evade it.
[dependencies]
tiler-artifact.workspace = true
tiler-build.workspace = true
tiler-cache.workspace = true
tiler-compiler.workspace = true
tiler-digest.workspace = true
tiler-ir.workspace = true
tiler-metal.workspace = true
tiler-metal-aot.workspace = true
tiler-reference.workspace = true
tiler-runtime.workspace = true

# `metal` binds Apple frameworks and cannot link anywhere else, so an
# unconditional edge would make `cargo check --workspace` structurally
# impossible on a non-Apple host. The device-reaching half of a conformance run
# is selected by the same `cfg`; the deterministic half is not, which is what
# lets a non-Apple host still run it and report the measurement boundary as
# unavailable rather than skip.
[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true

# This crate does not inherit `[workspace.lints]`, and the difference is exactly
# one lint. The workspace sets `unsafe_code = "forbid"`, which cannot be relaxed
# by an inner attribute at any scope; this crate sets `deny` instead so the two
# functions that must reach `MTLBuffer` storage can carry narrow, reasoned
# `#[allow(unsafe_code)]` attributes. `prototypes/serial-sum-run` is the other
# checked `deny` exception; the remaining fourteen members keep `forbid`.
#
# **Decided by Tom on 2026-08-07** and recorded on
# `decide-the-conformance-crate-s-unsafe-lint-level-for-device-buffer-access`.
# The rule is narrower than the `prototypes/serial-sum-run` precedent it matches
# in shape, and the narrowing is the point:
#
# - `deny` with named `#[allow(unsafe_code)]` at **individual sites**. A
#   crate-level allow is refused outright and is not a fallback if the sites
#   prove awkward.
# - The **only admitted justification is FFI memory management with Metal** —
#   concretely the raw pointer `metal::Buffer::contents` returns, because
#   `MTLBuffer` storage is reachable no other way. Not convenience, not
#   performance, not a tidier shape.
# - **Isolation is a design constraint.** Every site lives in `src/device_buffer.rs`,
#   which exposes a safe byte interface; the conformance logic — corpus, oracle
#   comparison, evidence attribution — contains no `unsafe` and must not need
#   any.
# - Each site carries what
#   [ADR 0079](../../docs/decisions/0079-permit-unsafe-code-case-by-case-at-named-sites.md)
#   requires: no safe foreign-API route, a reasoned `#[allow]`, a bounding
#   assertion, and a `SAFETY` explanation naming the invariant and why the
#   foreign API forces it.
#
# This crate's population is **two**, named in `src/device_buffer.rs`'s header.
# `crates/tiler/tests/workspace_unsafe_sites.rs` cross-checks the explicit member
# list against Cargo's actual workspace packages, enumerates their targets and
# source-loading edges, and pins this pair's paths, complete item signatures,
# and exact reasons beside the prototype pair. A third site, a move, a removal,
# or a reason change is therefore a red test rather than an absorbed edit.
#
# The level moved with the first site that needed it rather than as a standalone
# relaxation: a level moved with no site under it would be a relaxation for
# nothing.
#
# **Restating the table has its own cost, and it is checked rather than
# trusted.** A lint added, tightened, or removed in `[workspace.lints]` reaches
# the fourteen inheriting members and neither checked `deny` exception.
# `src/lints.rs` reads both manifests and fails unless they differ by exactly
# the one level above — so drift is a red test here, and matching the tables by
# weakening a lint fails the same way. The workspace-wide inheritance test
# holds the exception set to exactly these two and requires each to name an
# in-member table check; the prototype runs this same reader through its
# `tests/lint_table.rs` adapter. ADR 0079 records the combined boundary.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirrors the workspace, which this crate cannot inherit; see the note there.
too_many_lines = "allow"
