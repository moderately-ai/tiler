[package]
name = "tiler-compiler"
description = "Target-independent optimization and scheduling for Tiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = true
doctest = true
doc = true

[dependencies]
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
tiler-ir.workspace = true

# `tiler-digest` is a *development* edge because the only source here that names
# it is `src/governed/contraction_conformance.rs`, which is `#[cfg(test)]`. That
# module reproduces the L3 realization probe's retained raw `CC_SHA256` record
# through `DigestAlgorithm::digest_external_record`; ADR 0111 admitted that typed
# path and deleted the SHA-256 implementation the module used to carry, on the
# rule that a source file naming a crate's public item owns a direct Cargo edge.
# The crate is already in this one's normal closure through `tiler-ir`, so the
# edge adds nothing to a consumer's build graph — it states what source reaches.
[dev-dependencies]
tiler-digest.workspace = true
tiler-reference.workspace = true

[lints]
workspace = true
