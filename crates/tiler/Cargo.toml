[package]
name = "tiler"
description = "Consumer-facing facade for Tiler's inline tensor frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = true
doctest = true
doc = true

# `tiler-ir` is here for one type, deliberately. `tiler_ir::program::StorageScalar`
# is the authority over the scalar a storage position holds, and `value`
# re-exports it rather than minting a second element-type vocabulary. A
# facade-local enum would leave the correspondence between what an expansion
# decides and what this crate means held by the text of the emitted tokens and
# nothing else, because `tiler-macros` cannot depend back on this crate. See the
# crate documentation for the derivation and for the cost this edge carries into
# a consumer's build graph.
#
# `tiler-runtime` and `tiler-artifact` are the guarded-selection half. An
# expansion that stated a selected artifact family embeds an artifact envelope
# in the consumer's binary, and `route` is what decodes and routes it — so this
# is the crate that has to hold the loader. The cost is the one the facade
# documentation already priced: `tiler-runtime`'s dependency closure is
# `[tiler-artifact]` by ADR 0081 item 2, `tiler-artifact` is `tiler-digest` and
# `tiler-ir`, `tiler-ir` was already here, and `tiler-digest` is `sha2` — the
# same closure ADR 0104 redistributed rather than widened. Neither reaches an Apple
# toolchain, a device object, or a compiler: `tiler-runtime` "touches no device,
# no `MTLDevice`, no pipeline state, and no platform binding", which is what
# makes it affordable on a consumer-neutral boundary where `tiler-metal-aot` is
# not. `tests/dependency_direction.rs` is what keeps that distinction true.
[dependencies]
tiler-artifact.workspace = true
tiler-ir.workspace = true
tiler-macros.workspace = true
tiler-runtime.workspace = true

[dev-dependencies]
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true
